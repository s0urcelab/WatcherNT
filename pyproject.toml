[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "watchernt"
version = "0.1.0"
description = "Windows tray application for keeping programs alive and updating them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "PySide6>=6.8",
    "httpx>=0.28",
    "packaging>=24.2",
    "platformdirs>=4.3",
    "psutil>=6.1",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
watchernt = "watchernt.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
